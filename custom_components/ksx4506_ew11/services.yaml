check_state:
  name: 상태 다시 확인
  description: 활성 등록 주소 한 곳의 상태만 조회합니다. 출력을 켜거나 끄지 않습니다. 송신 1회·전체 2초·동일 주소 30초·통합 전체 5초 간격 제한이 있습니다.
  fields:
    entry_id:
      name: EW11 통합
      required: true
      selector:
        config_entry:
          integration: ksx4506_ew11
    endpoint:
      name: 확인할 주소
      description: RS485 Device Vitality의 endpoint를 입력하세요. 예시 0E/11 또는 0x0E/0x11. device ID/sub ID이며 조명 채널 번호가 아닙니다.
      required: true
      selector:
        text:
review_discovery:
  name: Review discovery candidate
  description: Approve a verified new candidate or reject it for 24 hours. Never deletes registered devices.
  fields:
    entry_id:
      name: Integration entry
      required: true
      selector:
        config_entry:
          integration: ksx4506_ew11
    endpoint:
      name: Endpoint
      description: Hexadecimal address shown in discovery diagnostics, for example 0E/1F.
      required: true
      selector:
        text:
    approve:
      name: Approve
      description: Approves only the currently observed device list. Changed topology requires another review.
      required: true
      selector:
        boolean:
