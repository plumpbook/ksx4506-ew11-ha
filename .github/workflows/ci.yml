name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Syntax check
        run: uv run python -m compileall -q custom_components/ksx4506_ew11 tests

      - name: Run tests
        run: uv run pytest -q

      - name: Type check
        run: uv run basedpyright
